<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairycore Dream</title>
<style>
body {
    margin: 0;
    font-family: "Georgia", serif;
    background: linear-gradient(135deg, #ffe4ec, #e6ffe6);
    color: #4b6043;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-image: radial-gradient(circle at 20% 30%, rgba(255,192,203,0.3) 0%, transparent 40%),
                      radial-gradient(circle at 80% 70%, rgba(144,238,144,0.3) 0%, transparent 40%);
}

.container {
    background: rgba(255, 255, 255, 0.7);
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    text-align: center;
    backdrop-filter: blur(10px);
    border: 1px solid #ffd6e8;
}

h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
    color: #d46a92;
}

p {
    font-size: 1em;
    margin-bottom: 20px;
}

button {
    background: linear-gradient(45deg, #ffb6c1, #c1ffc1);
    border: none;
    padding: 10px 25px;
    border-radius: 25px;
    font-size: 1em;
    cursor: pointer;
    transition: 0.3s;
    color: #4b6043;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}
</style>
</head>
<body>

<div class="container">
    <h1>✿ Fairy Garden ✿</h1>
    <p>soft petals, gentle magic, and a dreamy world</p>
    <button>enter ♡</button>
</div>

</body>
</html>
